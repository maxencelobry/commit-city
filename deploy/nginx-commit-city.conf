# Include this location block in the hustlers.studio virtual host.
# Other projects can add their own `location /project-name/` blocks.
location = /commit-city {
    return 301 /commit-city/;
}

location /commit-city/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /commit-city;
}