<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Commit City</title><style>:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#101217;color:#f4f1e8}body{max-width:1000px;margin:0 auto;padding:48px 24px}h1{font-size:clamp(2rem,7vw,4.5rem);margin:0}strong{color:#c6f432}p{color:#9da5b2;line-height:1.6;max-width:650px}form{display:flex;gap:10px;margin:32px 0;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #3a414d;border-radius:8px;padding:13px;background:#1c2028;color:inherit}input{flex:1;min-width:200px}button{border:0;background:#c6f432;color:#14170c;font-weight:bold;cursor:pointer}img{width:100%;border:1px solid #303743;border-radius:12px;background:#101217}small{color:#9da5b2}</style></head><body><h1>COMMIT <strong>CITY</strong></h1><p>Turn the last 12 months of your public GitHub activity into a small SVG skyline.</p><form id="form"><input id="username" placeholder="GitHub username" aria-label="GitHub username" required><select id="theme" aria-label="Theme"><option value="night">Night</option><option value="day">Day</option></select><select id="color" aria-label="Color"><option value="lime">Lime</option><option value="purple">Purple</option><option value="blue">Blue</option><option value="orange">Orange</option></select><button>Generate</button></form><img id="city" hidden alt="Generated Commit City"><p><small id="url"></small></p><script>const form=document.querySelector('#form'),image=document.querySelector('#city'),url=document.querySelector('#url');form.addEventListener('submit',(event)=>{event.preventDefault();const name=username.value.trim().replace(/^@/,''),path=`/api/city/${encodeURIComponent(name)}.svg?theme=${theme.value}&color=${color.value}`;image.src=path;image.hidden=false;url.textContent=location.origin+path})</script></body></html>
